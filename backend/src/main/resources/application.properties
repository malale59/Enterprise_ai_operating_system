spring.application.name=eaos-backend

# Database connection, read from environment variables (see .env.example).
# The password has no default on purpose: no secret ever lives in the code.
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:eaos_dev}
spring.datasource.username=${POSTGRES_USER:eaos}
spring.datasource.password=${POSTGRES_PASSWORD:}

# Flyway owns the schema; JPA only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Expose only the health endpoint.
management.endpoints.web.exposure.include=health

# Load related rows in batches instead of one query per user (avoids the N+1 problem).
spring.jpa.properties.hibernate.default_batch_fetch_size=50
