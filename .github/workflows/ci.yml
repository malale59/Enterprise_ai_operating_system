name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 gives Gitleaks the full history it needs
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Format check (Spotless)
        run: mvn -B -f backend/pom.xml spotless:check

      - name: Build and test
        run: mvn -B -f backend/pom.xml verify

      - name: Build backend image
        run: docker build -t eaos-api backend

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
